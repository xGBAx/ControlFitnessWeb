<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ControlFitness - Histórico</title>
    <link rel="stylesheet" href="historico.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ControlFitness">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <div class="container">
        <header>
            <h1>Histórico de Treinos</h1>
            <a href="index.html" class="link-voltar">⬅ Voltar ao Início</a>
        </header>

   
        <div class="card" id="filtrosContainer">
            <h3>🔍 Filtrar Histórico</h3>
            <div class="form-grid">
                <div>
                    <label>Por Data:</label>
                    <input type="date" id="filtroData">
                </div>
                <div>
                    <label>Por Grupamento Muscular:</label>
                    <select id="filtroGrupo">
                        <option value="">Todos</option>
                        <option value="Peito">Peito</option>
                        <option value="Costas">Costas</option>
                        <option value="Perna">Perna</option>
                        <option value="Ombro">Ombro</option>
                        <option value="Braços">Braços</option>
                    </select>
                </div>
            </div>
            <div class="acoes-treino">
                <button class="btn" onclick="aplicarFiltros()">Aplicar Filtro</button>
                <button class="btn btn-secondary" onclick="limparFiltros()">Limpar Filtros</button>
            </div>
        </div>

        <div id="historicoContainer">

        </div>
    </div>

    <div id="fundoEscuro" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1999;"></div>

    <!-- Caixa customizada de exclusão -->
    <div id="caixaExcluir" class="card" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2000; text-align: center; width: 90%; max-width: 400px; border-top: 5px solid #f44336; margin: 0;">
        <h3 style="color: #f44336; margin-bottom: 15px;">Excluir Treino</h3>
        <p style="margin-bottom: 25px;">Tem certeza que deseja excluir este treino por completo?</p>
        <div class="acoes-treino">
            <button id="btnCancelar" class="btn btn-secondary">Cancelar</button>
            <button id="btnConfirmar" class="btn btn-danger">OK</button>
        </div>
    </div>

<script type="module" src="historico.js"></script>


<!-- Registro do Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrado com sucesso!', reg.scope))
                    .catch(err => console.error('Erro ao registrar Service Worker', err));
            });
        }
    </script>
    </body>
</html>
