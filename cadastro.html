<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ControlFitness - Cadastro</title>
    <link rel="stylesheet" href="login.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ControlFitness">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <div class="container">
        <h1>Criar Conta</h1>
        <p>Junte-se ao ControlFitness</p>
        
        <form id="formCadastro">
            <div class="input-group">
                <label for="nomeCadastro">Nome</label>
                <input type="text" id="nomeCadastro" placeholder="Seu nome" required>
            </div>

            <div class="input-group">
                <label for="emailCadastro">E-mail</label>
                <input type="email" id="emailCadastro" placeholder="Seu e-mail" required>
            </div>
            
            <div class="input-group">
                <label for="senhaCadastro">Senha</label>
                <input type="password" id="senhaCadastro" placeholder="Crie uma senha" required>
            </div>
            
            <button type="submit" class="btn">Cadastrar</button>
        </form>

        <div class="links-rodape">
            <p>Já tem uma conta? <a href="login.html" class="link-destaque">Faça Login</a></p>
            <a href="index.html" class="link-voltar">⬅ Voltar ao Início</a>
        </div>
    </div> 

    <script type="module" src="cadastro.js"></script>

    <!-- Registro do Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrado com sucesso!', reg.scope))
                    .catch(err => console.error('Erro ao registrar Service Worker', err));
            });
        }
    </script>
    
</body>
</html>
