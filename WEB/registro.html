<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ControlFitness - Registrar Treino</title>
    <link rel="stylesheet" href="registro.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ControlFitness">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <div class="container">
        <header>
            <h1>Registrar Treino</h1>
            <a href="index.html" class="link-voltar">⬅ Voltar ao Início</a>
        </header>

        <div class="card">
            <label>Data do Treino:</label>
            <input type="date" id="dataTreino" required>
        </div>

        <div class="card">
            <h3 id="tituloExercicio">Adicionar Exercício</h3>
            <div class="form-grid">
                <div>
                    <label>Grupamento Muscular:</label>
                    <select id="grupoMuscular">
                        <option value="">Selecione...</option>
                        <option value="Peito">Peito</option>
                        <option value="Costas">Costas</option>
                        <option value="Perna">Perna</option>
                        <option value="Ombro">Ombro</option>
                        <option value="Braços">Braços</option>
                    </select>
                </div>
                <div>
                    <label>Exercício Feito:</label>
                    <input type="text" id="nomeExercicio" placeholder="Ex: Supino Reto">
                </div>
                <div>
                    <label>Carga (kg):</label>
                    <input type="number" id="carga" placeholder="Ex: 20">
                </div>
                <div>
                    <label>Séries:</label>
                    <input type="number" id="series" placeholder="Ex: 4">
                </div>
                <div>
                    <label>Repetições:</label>
                    <input type="number" id="repeticoes" placeholder="Ex: 10">
                </div>
            </div>
            <button type="button" class="btn" id="btnAdicionarExercicio" style="margin-top: 15px;">+ Adicionar Exercício</button>
            <button type="button" class="btn btn-secondary" id="btnCancelarEdicao" style="margin-top: 15px; display: none;">Cancelar Edição</button>
        </div>

        <!-- PRÉ-VISUALIZAÇÃO DOS EXERCÍCIOS -->
        <div class="card" id="listaExerciciosContainer" style="display: none;">
            <h3>📋 Exercícios Registrados (Pré-visualização)</h3>
            <p style="font-size: 12px; color: #aaa; margin-bottom: 10px;">Estes exercícios ainda não foram salvos no histórico. Salve o treino completo abaixo.</p>
            <ul id="listaExercicios" class="exercicios-list"></ul>
        </div>

        <div class="card">
            <h3>Cardio</h3>
            <label>Fez cardio hoje?</label>
            <select id="fezCardio">
                <option value="nao">Não</option>
                <option value="sim">Sim</option>
            </select>

            <div id="cardioCampos" style="display: none; margin-top: 15px;">
                <label>Qual cardio?</label>
                <input type="text" id="tipoCardio" placeholder="Ex: Esteira, Bicicleta">
                <br><br>
                <label>Tempo (minutos):</label>
                <input type="number" id="tempoCardio" placeholder="Ex: 30">
            </div>
        </div>

        <button class="btn btn-success btn-large" id="btnSalvarTreino">💾 Salvar Treino Completo</button>
    </div>

    <div id="toast" class="toast">Treino salvo com sucesso!</div>   

<script type="module" src="registro.js"></script>
<!-- Registro do Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrado com sucesso!', reg.scope))
                    .catch(err => console.error('Erro ao registrar Service Worker', err));
            });
        }
    </script>
</body>
</html>
