<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ControlFitness - Início</title>
    <link rel="stylesheet" href="index.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ControlFitness">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <header class="cabecalho-topo">
        <div class="logo">🏋️‍♂️ ControlFitness</div>
        <div class="botoes-login" id="botoesLoginArea">
            <!-- Os botões serão injetados pelo JS abaixo -->
        </div>
    </header>

    <div class="container text-center">
        <p>Bem-vindo ao seu diário de treinos!</p>
        <div class="menu-buttons">
            <a href="registro.html" class="btn">Novo Treino</a>
            <a href="historico.html" class="btn btn-secondary">Ver Histórico</a>
        </div>
    </div>

    <!-- Script de Autenticação -->
    <script type="module">
        import { auth } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const botoesArea = document.getElementById('botoesLoginArea');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                botoesArea.innerHTML = `<button class="btn-login" style="border-color: #f44336; color: #f44336;" id="btnSair">Sair da Conta</button>`;
                document.getElementById('btnSair').addEventListener('click', () => {
                    signOut(auth).then(() => window.location.reload());
                });
            } else {
                botoesArea.innerHTML = `
                    <button class="btn-login" onclick="window.location.href='login.html'">Login</button>
                `;
            }
        });
    </script>
    <!-- Registro do Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrado com sucesso!', reg.scope))
                    .catch(err => console.error('Erro ao registrar Service Worker', err));
            });
        }
    </script>
</body>
</html>
